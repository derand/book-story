name: Build

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

# Newer pushes to the same ref cancel in-flight runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate every push/PR and produce the distributable APK. We build the
  # "release-debug" variant: optimized/minified like release and NOT debuggable,
  # but signed with the shared debug key so no release secrets are needed.
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble optimized APK (release-debug)
        run: ./gradlew ":app:assembleRelease-debug" --stacktrace

      # Robolectric downloads its ~81 MB "android-all" jar at test time, into
      # ~/.m2 rather than the Gradle caches, so setup-gradle does not cover it.
      # The level it fetches is pinned in app/src/test/resources.
      - name: Cache the Robolectric android-all jar
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/src/test/resources/robolectric.properties', 'app/build.gradle.kts') }}
          restore-keys: robolectric-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The step above fails the build on a failing test, but it is just as
      # green when it runs *no* tests — which is what it did for months, because
      # there was no app/src/test at all (#43). Count what actually ran.
      - name: Verify the unit tests actually ran
        shell: python3 {0}
        run: |
          import glob, sys, xml.etree.ElementTree as ET

          reports = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          total = sum(int(ET.parse(f).getroot().get("tests", "0")) for f in reports)
          print(f"{total} unit tests in {len(reports)} classes")
          if total == 0:
              print("::error::the unit test step ran zero tests")
              sys.exit(1)

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Stage APK under a stable name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release-debug/app-release-debug.apk out/book-story-nightly.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: book-story-nightly
          path: out/book-story-nightly.apk
          if-no-files-found: error

  # Publish the rolling "nightly" release — only for pushes to develop. Reuses
  # the APK from the build job (no second build) and attaches a build-provenance
  # attestation proving it was produced by this workflow from this commit.
  nightly:
    name: Publish nightly
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create/update the rolling release
      id-token: write       # sign the provenance attestation
      attestations: write   # record the attestation
    steps:
      - name: Download APK from build job
        uses: actions/download-artifact@v8
        with:
          name: book-story-nightly
          path: out

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/book-story-nightly.apk

      - name: Publish rolling "nightly" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT="${SHA:0:7}"
          NOTES="Automated optimized build from \`develop\` @ ${SHORT}.

          Built by GitHub Actions run [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) — produced from this repo's code, not uploaded by hand.

          **Verify it was built from this repo:**
          \`\`\`
          gh attestation verify book-story-nightly.apk --repo ${REPO}
          \`\`\`

          Optimized \`release-debug\` build: minified and NOT debuggable, applicationId \`...release.debug\`, signed with the shared debug key (installs alongside a store build)."
          # Recreate so the 'nightly' tag/release always points at the latest commit.
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          gh release create nightly out/book-story-nightly.apk \
            --repo "$REPO" \
            --target "$SHA" \
            --prerelease \
            --title "Nightly (develop)" \
            --notes "$NOTES"
