name: Nightly

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write       # create/update the rolling release
  id-token: write       # sign the build-provenance attestation
  attestations: write   # record the attestation

# Only one nightly publish at a time; a newer push supersedes an older one.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: Publish nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK under a stable name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/book-story-nightly.apk

      # Cryptographic proof that this exact APK was built by THIS workflow from
      # THIS commit. Verify with: gh attestation verify <file> --repo <owner/repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/book-story-nightly.apk

      - name: Publish rolling "nightly" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT="${SHA:0:7}"
          NOTES="Automated debug build from \`develop\` @ ${SHORT}.

          Built by GitHub Actions run [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) — produced from this repo's code, not uploaded by hand.

          **Verify it was built from this repo:**
          \`\`\`
          gh attestation verify book-story-nightly.apk --repo ${REPO}
          \`\`\`

          Debug build (applicationId \`...debug\`), signed with the shared debug key — installs alongside a future release build."
          # Recreate so the 'nightly' tag/release always points at the latest commit.
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          gh release create nightly out/book-story-nightly.apk \
            --repo "$REPO" \
            --target "$SHA" \
            --prerelease \
            --title "Nightly (develop)" \
            --notes "$NOTES"
