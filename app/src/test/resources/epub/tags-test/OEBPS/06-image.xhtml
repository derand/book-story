<h1>06. Images</h1>
<p>Below is a 48×32 picture with a caption (alt). Tapping it must open the fullscreen viewer.</p>
<p><img src="square.png" alt="An italic image caption"/></p>
<p>The same picture without a caption:</p>
<p><img src="square.png" alt=""/></p>
